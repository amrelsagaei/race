<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2380 460" width="2380" height="460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#17191f"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity="0.03"/>
    </pattern>
    <clipPath id="round">
      <rect x="0" y="0" width="2380" height="460" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="2380" height="460" fill="url(#bg)"/>
    <g fill="none" stroke="#ffffff" stroke-width="1.5">
      <circle cx="1190" cy="230" r="300" opacity="0.045"/>
      <circle cx="1190" cy="230" r="500" opacity="0.032"/>
      <circle cx="1190" cy="230" r="700" opacity="0.022"/>
    </g>
    <rect x="0" y="0" width="2380" height="460" fill="url(#dots)"/>

    <g transform="translate(931,116)">
      <rect x="0" y="0" width="10" height="134" rx="4" fill="#f4f4f5"/>
      <g fill="#f4f4f5">
        <rect x="10" y="6" width="29" height="29"/>
        <rect x="68" y="6" width="29" height="29"/>
        <rect x="39" y="35" width="29" height="29"/>
        <rect x="97" y="35" width="29" height="29"/>
        <rect x="10" y="64" width="29" height="29"/>
        <rect x="68" y="64" width="29" height="29"/>
