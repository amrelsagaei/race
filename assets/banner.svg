      <rect x="10" y="6" width="116" height="87" fill="none" stroke="#f4f4f5" stroke-width="4"/>
    </g>

    <text x="1096" y="228" font-size="150" font-weight="800" letter-spacing="-3" fill="#f4f4f5">Race</text>

    <text x="1190" y="306" text-anchor="middle" font-size="44" font-weight="500" fill="#9a9aa4">Fire synchronized bursts. Catch the race.</text>

    <g font-size="30" font-weight="700" fill="#c4c4cc">
      <circle cx="765" cy="366" r="6" fill="#e8a33d"/>
      <text x="779" y="376">Right-click to launch</text>
      <circle cx="1152" cy="366" r="6" fill="#e8a33d"/>
